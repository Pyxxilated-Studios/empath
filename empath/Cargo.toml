[package]
name = "empath"
version = "1.0.0"
description = "An MTA written in Rust"
build = "build.rs"
categories.workspace = true
keywords.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "empath"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "empath"
path = "bin/empath.rs"

[[bin]]
name = "empathctl"
path = "bin/empathctl.rs"

[[bin]]
name = "empathcfg"
path = "bin/empathcfg.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
chrono.workspace = true
empath-common.workspace = true
empath-control.workspace = true
empath-delivery.workspace = true
empath-ffi.workspace = true
empath-health.workspace = true
empath-metrics.workspace = true
empath-smtp.workspace = true
empath-spool.workspace = true
empath-tracing.workspace = true
libc.workspace = true
ron.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
anyhow.workspace = true
cbindgen.workspace = true
