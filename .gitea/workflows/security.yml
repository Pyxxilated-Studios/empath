name: Security Scanning

on:
  push:
    branches: ["master", "main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".gitea/workflows/security.yml"
  pull_request:
    branches: ["master", "main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    # Run security audit daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  cargo-audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: |
          # Fail on HIGH and CRITICAL vulnerabilities
          # Allow MEDIUM, LOW, and UNMAINTAINED warnings
          cargo audit --deny warnings --ignore RUSTSEC-0000-0000 || {
            echo "::error::Security vulnerabilities detected. Run 'just deps-audit' locally for details."
            exit 1
          }

      - name: Generate audit report
        if: always()
        run: |
          cargo audit --json > audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: audit-report.json
          retention-days: 30

  cargo-deny:
    name: License and Dependency Policy Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny
        run: cargo deny check

  sbom-generation:
    name: Generate SBOM (Software Bill of Materials)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      - name: Generate SBOM (CycloneDX format)
        run: cargo cyclonedx --format json --all

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: "*-bom.json"
          retention-days: 90

      - name: Generate SBOM summary
        run: |
          echo "## SBOM Generated" >> $GITHUB_STEP_SUMMARY
          echo "SBOM files:" >> $GITHUB_STEP_SUMMARY
          ls -lh *-bom.json >> $GITHUB_STEP_SUMMARY
