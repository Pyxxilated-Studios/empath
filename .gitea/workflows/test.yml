name: Analyze - Server

on:
  push:
    branches: ["master","main"]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: ["master","main"]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  analyze-clippy:
    env:
      RUNNER_TOOL_CACHE: /toolcache
      RUSTFLAS: "-Dwarnings"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: rui314/setup-mold@v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run rust-clippy
        run: cargo clippy --all-targets --all-features

      - name: Run rust-fmt
        run: cargo fmt --all -- --check

  test-server:
    env:
      RUNNER_TOOL_CACHE: /toolcache
      RUSTFLAS: -Dwarnings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: rui314/setup-mold@v1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: clippy miri
          targets: wasm32-wasip2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Test Server (under miri)
        run: MIRIFLAGS="-Zmiri-disable-isolation" cargo miri nextest run

      - name: Test server
        run: cargo nextest run

      - name: Doc Tests
        run: cargo test --doc

      - name: Test Property-Based
        run: cargo nextest run --test proptest_commands

      - name: Test E2E
        run: cargo nextest run --test e2e_basic --test-threads=1

  stable-check:
    name: Stable compatibility (allowed to fail)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: rui314/setup-mold@v1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (stable, allow failure until nightly features removed)
        run: cargo +stable build --all --all-targets
