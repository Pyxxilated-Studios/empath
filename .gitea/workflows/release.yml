name: Release

on:
  push:
    branches: [ "master", "main" ]
    tags: ["v*"]
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - "*.md"
      - ".*ignore"
      - "benches/**"
  workflow_dispatch:

env:
  REGISTRY: git.pyxxilated.media
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags') }}
            type=raw,value=develop

      - name: Build and push Docker Image
        uses: docker/build-push-action@v6.18.0
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: docker/Dockerfile

  sbom:
    name: Generate and Publish SBOM
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install cargo-sbom
        run: cargo install cargo-sbom

      - name: Generate SBOM
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cargo sbom > "empath-${VERSION}-sbom.json"

      - name: Upload SBOM artifacts
        uses: https://github.com/christopherHX/gitea-upload-artifact@v4
        with:
          name: sbom
          path: |
            empath-*-sbom.json
          retention-days: 365

      - name: Create SBOM checksums
        run: |
          sha256sum empath-*-sbom.* > empath-sbom-checksums.txt

      - name: Upload SBOM checksums
        uses: https://github.com/christopherHX/gitea-upload-artifact@v4
        with:
          name: sbom-checksums
          path: empath-sbom-checksums.txt
          retention-days: 365
