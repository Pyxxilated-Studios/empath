
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.8
    hooks:
      - id: committed

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
    - id: fmt
      args: ["--", "--check"]
      types: ["rust"]
    - id: clippy
      args: ["--all-targets", "--all-features"]
      types: ["rust"]
