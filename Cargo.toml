[workspace]
resolver = "3"
members = [
    "empath",
    "empath-common",
    "empath-control",
    "empath-delivery",
    "empath-examples",
    "empath-examples/wasm",
    "empath-ffi",
    "empath-health",
    "empath-metrics",
    "empath-python",
    "empath-smtp-client",
    "empath-smtp",
    "empath-spool",
    "empath-tracing",
    "empath-wasm",
    "empath-wasm-guest",
    "empath-wasm-guest-macros",
    "xtask",
]
default-members = [
    "empath",
    "empath-common",
    "empath-control",
    "empath-delivery",
    "empath-ffi",
    "empath-health",
    "empath-metrics",
    "empath-python",
    "empath-smtp-client",
    "empath-smtp",
    "empath-spool",
    "empath-tracing",
    "empath-wasm",
    "empath-wasm-guest",
    "empath-wasm-guest-macros",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Pyxxil"]
repository = "https://github.com/Pyxxilated-Studios/empath"
categories = ["command-line-utilities", "email", "network-programming"]
keywords = ["email"]

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
must_use_candidate = "allow"
# Deny unwrap/expect in production code (test unwraps are acceptable via #[allow] attribute)
unwrap_used = "deny"
expect_used = "deny"
# Deny panic-related macros in production code (tests are allowed via #[allow] attribute)
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[workspace.lints.rust]
dead_code = "deny"

[workspace.dependencies]
ahash = { version = "0.8", default-features = false, features = [
    "serde",
    "std",
    "compile-time-rng",
] }
anyhow = "1.0"
arrayvec = "0.7"
async-trait = "0.1"
axum = "0.8"
cap-std = "4.0"
cbindgen = { version = "0.29", default-features = false }
charset = "0.1.5"
chrono = "0.4"
clap = { version = "4", default-features = false, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
] }
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
dashmap = "6"
empath = { path = "empath", version = "0" }
empath-common = { path = "empath-common", version = "0" }
empath-control = { path = "empath-control", version = "0" }
empath-delivery = { path = "empath-delivery", version = "0" }
empath-examples = { path = "empath-examples", version = "0" }
empath-ffi = { path = "empath-ffi", version = "0" }
empath-health = { path = "empath-health", version = "0" }
empath-metrics = { path = "empath-metrics", version = "0" }
empath-python = { path = "empath-python", version = "0" }
empath-smtp = { path = "empath-smtp", version = "0" }
empath-smtp-client = { path = "empath-smtp-client", version = "0" }
empath-spool = { path = "empath-spool", version = "0" }
empath-tracing = { path = "empath-tracing", version = "0" }
empath-wasm = { path = "empath-wasm", version = "0" }
empath-wasm-guest = { path = "empath-wasm-guest", version = "0" }
empath-wasm-guest-macros = { path = "empath-wasm-guest-macros", version = "0" }
encoding_rs = "0.8.35"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
hickory-resolver = { version = "0.25", features = ["dnssec-ring"] }
mail-auth = { version = "0.7", default-features = false, features = ["ring"] }
hyper = "1"
hyper-rustls = "0.27"
hyper-util = "0.1"
http-body-util = "0.1"
ipnetwork = { version = "0.21", features = ["serde"] }
libc = "0.2"
libloading = "0.9"
notify = "8"
num_cpus = "1"
once_cell = "1"
opentelemetry = { version = "0.31", default-features = false, features = [
    "trace",
] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = [
    "rt-tokio",
    "trace",
] }
opentelemetry-otlp = "0.31"
parking_lot = "0.12"
phf = { version = "0.13", default-features = false, features = ["macros"] }
pretty_assertions = "1"
proc-macro2 = "1"
proptest = "1.9"
pyo3 = { version = "0.27", default-features = false, features = [
    "auto-initialize",
    "macros",
] }
quote = "1"
rand = "0.9"
rand_core = "0"
postcard = { version = "1", default-features = false, features = ["alloc"] }
ron = "0.12"
rustls-native-certs = "0.8"
serde = { version = "1", default-features = false, features = ["derive", "rc"] }
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
syn = "2"
sysinfo = "0.37"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = [
    "fs",
    "io-util",
    "net",
    "macros",
    "parking_lot",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-rustls = "0.26"
tower-http = { version = "0.6", default-features = false, features = [
    "timeout",
] }
tracing = { version = "0.1", default-features = false, features = [
    "attributes",
    "std",
] }
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "chrono",
    "env-filter",
    "fmt",
    "json",
] }
ulid = { version = "1", features = ["serde"] }
wasmtime = { version = "40.0", features = ["component-model"] }
wasmtime-wasi = { version = "40.0", default-features = false, features = [
    "p2",
] }
wit-bindgen = "0"
x509-parser = "0"

[profile.release]
lto = "thin"
opt-level = 2
codegen-units = 1

[profile.bench]
inherits = "release"
# Enable debug info for profiling benchmarks with tools like perf or flamegraph
debug = true
