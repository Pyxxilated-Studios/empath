[workspace]
resolver = "3"
members = [
    "empath",
    "empath-common",
    "empath-control",
    "empath-delivery",
    "empath-ffi",
    "empath-health",
    "empath-metrics",
    "empath-python",
    "empath-smtp",
    "empath-spool",
    "empath-tracing",
    "empath-wasm",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Pyxxil"]
repository = "https://github.com/Pyxxilated-Studios/empath"
categories = ["command-line-utilities", "email", "network-programming"]
keywords = ["email"]

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
must_use_candidate = "allow"
# Deny unwrap/expect in production code (test unwraps are acceptable via #[allow] attribute)
unwrap_used = "deny"
expect_used = "deny"
# Deny panic-related macros in production code (tests are allowed via #[allow] attribute)
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[workspace.lints.rust]
dead_code = "deny"

[workspace.dependencies]
ahash = { version = "0.8", default-features = false, features = [
    "serde",
    "std",
    "compile-time-rng",
] }
anyhow = "1.0"
arrayvec = "0.7"
async-trait = "0.1"
axum = "0.8"
bincode = { version = "2", default-features = false, features = ["serde"] }
cbindgen = { version = "0.29", default-features = false }
charset = "0.1.5"
chrono = "0.4"
clap = { version = "4", default-features = false, features = ["derive", "std"] }
criterion = { version = "0.8", features = ["html_reports"] }
dashmap = "6"
empath-common = { path = "empath-common", version = "*" }
empath-control = { path = "empath-control", version = "*" }
empath-delivery = { path = "empath-delivery", version = "*" }
empath-ffi = { path = "empath-ffi", version = "*" }
empath-health = { path = "empath-health", version = "*" }
empath-metrics = { path = "empath-metrics", version = "*" }
empath-python = { path = "empath-python", version = "*" }
empath-smtp = { path = "empath-smtp", version = "*" }
empath-spool = { path = "empath-spool", version = "*" }
empath-tracing = { path = "empath-tracing", version = "*" }
empath-wasm = { path = "empath-wasm", version = "*" }
encoding_rs = "0.8.35"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
hickory-resolver = "0.25"
hyper = "1"
libc = "0.2"
libloading = "0.9"
num_cpus = "1"
once_cell = "1"
opentelemetry = { version = "0.31", default-features = false, features = [
    "trace",
] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = [
    "rt-tokio",
    "trace",
] }
opentelemetry-otlp = "0.31"
parking_lot = "0.12"
phf = { version = "0.13", default-features = false, features = ["macros"] }
proptest = "1.9"
pyo3 = { version = "0.25", default-features = false, features = [
    "auto-initialize",
    "macros",
] }
rand = "0.9"
ron = "0.12"
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
serde = { version = "1", default-features = false, features = ["derive", "rc"] }
sha2 = "0.10"
sysinfo = "0.37"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = [
    "fs",
    "io-util",
    "net",
    "macros",
    "parking_lot",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-rustls = "0.26"
tower-http = { version = "0.6", default-features = false, features = [
    "timeout",
] }
tracing = { version = "0.1", default-features = false, features = [
    "attributes",
    "std",
] }
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "chrono",
    "env-filter",
    "fmt",
    "json",
] }
ulid = "1"
wasmtime = "39.0"
wasmtime-wasi = "39.0"

[profile.release]
lto = "thin"
opt-level = 2
codegen-units = 1

[profile.bench]
inherits = "release"
# Enable debug info for profiling benchmarks with tools like perf or flamegraph
debug = true
