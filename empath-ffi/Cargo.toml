[package]
name = "empath-ffi"
version = "1.0.0"
categories.workspace = true
keywords.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "empath_ffi"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
ahash.workspace = true
empath-common.workspace = true
empath-metrics = { workspace = true, optional = true }
empath-tracing.workspace = true
libc.workspace = true
libloading.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
typetag.workspace = true

# Python module support (consolidated from empath-python)
parking_lot = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }

# WASM module support (consolidated from empath-wasm)
anyhow = { workspace = true, optional = true }
cap-rand = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["metrics", "python"]
metrics = ["dep:empath-metrics"]
python = ["dep:pyo3", "dep:parking_lot"]
wasm = [
    "dep:anyhow",
    "dep:cap-rand",
    "dep:postcard",
    "dep:wasmtime",
    "dep:wasmtime-wasi",
]

[build-dependencies]
cbindgen.workspace = true
